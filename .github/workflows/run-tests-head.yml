name: Tests head

permissions: write-all

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  pull_request:
    types: [opened, labeled, synchronize, reopened]

jobs:
  test:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'tests:run-head'))
    runs-on: ubuntu-26.04-arm
    strategy:
      matrix:
        go:
          - "1.27"
          - "1.26"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Go ${{ matrix.go }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}

      - name: Delete any existing `head` image
        run: docker rmi clickhouse/clickhouse-server:head -f

      - name: Pull latest clickhouse-server:head image
        # The `head` tag is mutable: it is re-tagged on every upstream build.
        # Self-hosted runners cache images by tag, so without an explicit pull
        # the job would keep running against whichever `head` was first cached.
        run: docker pull clickhouse/clickhouse-server:head

      - name: Tests
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"
          GOTOOLCHAIN: "local"
        run: |
          CLICKHOUSE_VERSION=head make test

  notify-failure:
    # Report failures of the nightly and manual runs to Slack. A run on a pull request is
    # not reported: its author sees the result on the pull request.
    needs: test
    if: failure() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # The job uses only the Slack webhook secret. It does not need the GITHUB_TOKEN.
    permissions: {}
    steps:
      - name: Post to #integrations-escalation
        uses: slackapi/slack-github-action@0bc3581177d9a0f8d555e07689384b376528e8fa # v4.1.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_INTEGRATIONS_ESCALATION }}
          webhook-type: incoming-webhook
          errors: true
          payload: |
            text: ":red_circle: clickhouse-go *${{ github.workflow }}* failed against `clickhouse/clickhouse-server:head` (${{ github.event_name }}, commit `${{ github.sha }}`): ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
