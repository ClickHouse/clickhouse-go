name: Tests cloud

# Least privilege: fork code runs in this job with the base repo token.
# contents:read for checkout, pull-requests:write to remove the label.
permissions:
  contents: read
  pull-requests: write

on:
  push:
    branches:
      - main
  workflow_dispatch:
  pull_request_target:
    branches:
      - main
    types: [labeled]

jobs:
  test:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request_target' && github.event.label.name == 'tests:run-cloud')
    runs-on: ubuntu-26.04-arm
    defaults:
      run:
        shell: bash
    strategy:
      # Run the Go-version jobs one at a time (1.26 then 1.27) instead of in parallel: they
      # share a single ClickHouse Cloud service, so concurrent jobs contend for its compute and
      # collide on shared object names. fail-fast: false keeps the second job running even if
      # the first fails.
      max-parallel: 1
      fail-fast: false
      matrix:
        go:
          - "1.26"
          - "1.27"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # head.sha is fixed at the time of the `labeled` event, so commits pushed
          # after a maintainer adds the label do not run.
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.ref }}
          # Fork code runs in a trusted context (secrets, base repo token). This is
          # intentional: a maintainer must review the PR and add `tests:run-cloud`
          # before this job runs. See https://gh.io/securely-using-pull_request_target
          allow-unsafe-pr-checkout: true
          # Do not leave GITHUB_TOKEN in .git/config, where fork code can read it.
          persist-credentials: false

      - name: Install Go ${{ matrix.go }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}

      - name: Tests
        env:
          CLICKHOUSE_USE_DOCKER: false
          CLICKHOUSE_USE_SSL: true
          CLICKHOUSE_HOST: ${{ secrets.INTEGRATIONS_TEAM_TESTS_CLOUD_HOST_SMT_PROD }}
          CLICKHOUSE_PASSWORD: ${{ secrets.INTEGRATIONS_TEAM_TESTS_CLOUD_PASSWORD_SMT_PROD }}
          CLICKHOUSE_JWT: ${{ secrets.INTEGRATIONS_TEAM_TESTS_CLOUD_JWT_DESERT_VM_43_PROD }}
          TESTCONTAINERS_RYUK_DISABLED: "true"
          GOTOOLCHAIN: "local"
        run: |
          CLICKHOUSE_DIAL_TIMEOUT=20 CLICKHOUSE_TEST_TIMEOUT=1200s CLICKHOUSE_QUORUM_INSERT=2 make test

      - name: Remove tests:run-cloud label
        if: always() && github.event_name == 'pull_request_target'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/labels/tests%3Arun-cloud -X DELETE || true
