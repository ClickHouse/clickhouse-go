name: Tests cloud

permissions:
  contents: read

on:
  push:
    branches:
      - main
  workflow_dispatch:
  pull_request_target:
    branches:
      - main
    types: [labeled]

jobs:
  test:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request_target' && github.event.label.name == 'tests:run-cloud')
    runs-on: [self-hosted, style-checker-aarch64]
    defaults:
      run:
        shell: bash
    strategy:
      # Run the Go-version jobs one at a time (1.25 then 1.26) instead of in parallel: they
      # share a single ClickHouse Cloud service, so concurrent jobs contend for its compute and
      # collide on shared object names. fail-fast: false keeps the second job running even if
      # the first fails.
      max-parallel: 1
      fail-fast: false
      matrix:
        go:
          - "1.25"
          - "1.26"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.ref }}
          # The fork code checked out on the line above must not inherit a usable
          # git credential.
          persist-credentials: false

      - name: Install Go ${{ matrix.go }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}

      - name: Tests
        env:
          CLICKHOUSE_USE_DOCKER: false
          CLICKHOUSE_USE_SSL: true
          CLICKHOUSE_HOST: ${{ secrets.INTEGRATIONS_TEAM_TESTS_CLOUD_HOST_SMT_PROD }}
          CLICKHOUSE_PASSWORD: ${{ secrets.INTEGRATIONS_TEAM_TESTS_CLOUD_PASSWORD_SMT_PROD }}
          CLICKHOUSE_JWT: ${{ secrets.INTEGRATIONS_TEAM_TESTS_CLOUD_JWT_DESERT_VM_43_PROD }}
          TESTCONTAINERS_RYUK_DISABLED: "true"
          GOTOOLCHAIN: "local"
        run: |
          CLICKHOUSE_DIAL_TIMEOUT=20 CLICKHOUSE_TEST_TIMEOUT=1200s CLICKHOUSE_QUORUM_INSERT=2 make test

  # Dropping the label needs a write scope, so it runs in its own job on a clean
  # runner that never checks out the pull request. The job above keeps read-only
  # access even though it executes fork code.
  remove-label:
    needs: [test]
    if: always() && github.event_name == 'pull_request_target' && github.event.label.name == 'tests:run-cloud'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Remove tests:run-cloud label
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/labels/tests%3Arun-cloud -X DELETE || true
